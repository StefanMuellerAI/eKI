openapi: 3.1.1
info:
  title: eKI API
  version: 1.0.2
  description: |
    KI-gestützte Sicherheitsprüfung für Drehbücher - Filmakademie Baden-Württemberg

    Die eKI ist eine modulare REST-API, die Drehbücher aus dem eProjekt-System entgegennimmt,
    KI-gestützt auf Sicherheitsrisiken analysiert und strukturierte Reports zurückliefert.

    ## Kernprinzipien
    - **Design-First:** Diese OpenAPI-Spezifikation ist die Single Source of Truth. Die zur Laufzeit
      unter `/openapi.json` (nur bei `DEBUG=true`) ausgelieferte Spec wird von FastAPI generiert und ist
      nicht verbindlich; `tests/test_m12_openapi_contract.py` prüft Routen, Enums und Version gegen diese Datei.
    - **Processing-Only:** Keine persistente Speicherung von Drehbüchern/Reports (nur Audit-Metadaten);
      Inhalte liegen nur transient und verschlüsselt im Buffer (TTL `BUFFER_TTL_SECONDS`, Standard 6 h).
      Details und Ausnahmen: `docs/DATENSCHUTZ.md`.
    - **Write-Through:** Im Push-Modus wird das Ergebnis sofort an eProjekt zurückgespielt, im Pull-Modus
      einmalig per One-Shot-GET abgeholt; danach wird der Inhalt gelöscht.
    - **Minimalinvasiv:** Integration nur über REST, keine direkten DB-Zugriffe

    ## Änderungen in Release 1.0.1 (für Clients sichtbar)
    - `POST /v1/security/check` (synchroner M01-Stub ohne Analyse) wurde entfernt und antwortet mit
      404 (`ErrorResponse`, `error=NotFound`). Einziger Prüf-Endpunkt ist `POST /v1/security/check:async`.
    - Alle `/v1/kb/*`-Endpunkte verlangen einen Admin-API-Key (`is_admin=true`); andere Keys erhalten 403.
    - `callback_url` ist wirksam: Push-Ziel dieses Jobs statt
      `{EPRO_BASE_URL}/eki/scl/set-risk-assessment/{project_id}` (gleiche Nutzlast, Header, Token,
      Retry-Fenster). Ohne `delivery` gilt dann `push`; `delivery=pull` zusammen mit `callback_url` → 422.
    - `priority` (1 = höchste … 10 = niedrigste, Standard 5) wird als Temporal-Task-Queue-Priorität
      gesetzt: unter Last werden Jobs höherer Priorität zuerst abgearbeitet.

    ## Bekannte Einschränkungen
    - `priority` ordnet nur wartende Aufgaben (Backlog) einer Task Queue; laufende Jobs werden nicht
      verdrängt, und bei mehreren Task-Queue-Partitionen gilt die Reihenfolge je Partition.
    - Verarbeitungsfehler (Parsing, Risikoanalyse nach Retries, Blockade durch den
      Prompt-Injection-Filter) beenden den Job mit `failed` und inhaltsfreier `error_message`
      (fail-closed) – `failed` bedeutet „keine automatische Bewertung", nie „kein Risiko".

    ## Meilenstein-Status
    - M01: Projektgerüst & OpenAPI ✓
    - M02: Parser Basis (FDX) ✓
    - M03: PDF & Streaming-Parsing (inkl. OCR-Fallback) ✓
    - M04: Risiko-Taxonomie & Scoring ✓
    - M05: Reports (JSON/PDF) & One-Shot-GET ✓
    - M06: LLM-Adapter (Mistral Cloud) & KB-Grundlage ✓
    - M07: Großdokument-Optimierung ✓
    - M08: Security/Privacy & Delete-on-Delivery ✓
    - M09: Observability & SLOs ✓
    - M10: Outbound-Adapter Hardening (Dead Letters, /v1/ops) ✓
    - M11: Lokaler LLM-Adapter & Paritätstests ✓
    - M12: UAT-Paket & Übergabe (OpenAPI 1.0.0) ✓

    ## Fehlerformat
    Alle Fehlerantworten nutzen `ErrorResponse` mit den Feldern `error`, `message`,
    `details[]`, `request_id`, `timestamp`. Jede Antwort trägt den Header `X-Request-ID`
    (vom Client übernommen oder serverseitig erzeugt); `request_id` im Fehler-Body ist immer
    gesetzt und entspricht diesem Header. Unbehandelte Serverfehler liefern ebenfalls
    `ErrorResponse`: 500 `InternalServerError` bzw. 503 (`ServiceUnavailable` /
    `ServiceUnavailableException`), wenn PostgreSQL, Redis oder Temporal nicht erreichbar sind.

  contact:
    name: Filmakademie Baden-Württemberg
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://eki-stage.filmakademie.de
    description: Staging environment
  - url: https://eki.filmakademie.de
    description: Production environment

tags:
  - name: Health
    description: Health and readiness checks
  - name: Security
    description: Security check operations
  - name: KnowledgeBase
    description: >-
      Knowledge Base management (M06) for RAG-augmented risk analysis. Since 1.0.1 every
      `/v1/kb/*` endpoint requires an API key with `is_admin=true`
      (`scripts/create_api_key.py --admin`); other keys get 403.
  - name: Operations
    description: >-
      Operations endpoints (M10). Require an API key with `is_admin=true`
      (`scripts/create_api_key.py --admin`). Metadata only, never script or report content.

paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness probe
      description: Simple health check that returns 200 if the service is running
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags:
        - Health
      summary: Readiness probe
      description: >-
        Checks if the service is ready to handle requests by verifying all
        dependencies (PostgreSQL, Redis, Temporal). Requires API-key authentication.
      operationId: readinessCheck
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: >-
            Service is not ready (`ReadinessResponse` with `status=not_ready`). If PostgreSQL itself
            is down, the API-key lookup fails first and the body is an `ErrorResponse`
            (`error=ServiceUnavailable`) instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

  /v1/security/check:async:
    post:
      tags:
        - Security
      summary: Asynchronous security check
      description: >-
        Start an asynchronous security check via Temporal workflow.
        Accepts JSON (base64-encoded script_content) or multipart/form-data file upload (.fdx, .pdf).
        The script content, intermediate results and per-scene findings are Fernet-encrypted (AES)
        in Redis; the workflow only receives reference keys plus metadata (see
        `docs/DATENSCHUTZ.md`). Supports idempotency keys (scoped to the API key's user) and the
        delivery modes `pull` (one-shot GET) and `push` (multipart POST to the job's `callback_url`
        if given, otherwise to `{EPRO_BASE_URL}/eki/scl/set-risk-assessment/{project_id}`).
        `callback_url` implies `push`; `delivery=pull` together with `callback_url` is rejected
        with 422. `priority` (1 = highest … 10 = lowest) becomes the Temporal task-queue priority
        of the job: when work is queued, higher-priority jobs are dispatched first.
      operationId: securityCheckAsync
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ActorUserId'
        - $ref: '#/components/parameters/ActorProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsyncSecurityCheckRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MultipartAsyncSecurityCheckRequest'
      responses:
        '202':
          description: Security check job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncSecurityCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: >-
            Multipart file exceeds `MAX_UPLOAD_SIZE_BYTES` (default 10 MB). An oversized JSON
            `script_content` is rejected with 422 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/security/jobs/{job_id}:
    get:
      tags:
        - Security
      summary: Get job status
      description: >-
        Query the status of an asynchronous security check job.
        Returns real data from the database including progress percentage and report ID.
        Ownership is verified against the authenticated API key.
      operationId: getJobStatus
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          description: Job ID to query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/security/reports/{report_id}:
    get:
      tags:
        - Security
      summary: Retrieve report (one-shot)
      description: >-
        Retrieve a security report (JSON + PDF). The URL is invalidated after
        the first successful retrieval (one-shot pull mode). Subsequent requests
        return 410 Gone. Ownership is verified against the authenticated API key.
        If the encrypted report is no longer in the buffer (TTL expired, already pushed to ePro,
        unreadable), the GET answers 410 ("Report is no longer available ...") without a report,
        without `X-One-Shot` and without marking the report as delivered. If the buffer (Redis)
        is unreachable, the GET answers 503 and the report stays retrievable.
      operationId: getReport
      security:
        - BearerAuth: []
      parameters:
        - name: report_id
          in: path
          required: true
          description: Report ID to retrieve
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Report retrieved successfully (URL now invalidated)
          headers:
            X-One-Shot:
              description: Always `true`; signals that this URL is deleted after this response (Pflichtenheft Anhang 1)
              schema:
                type: string
                example: 'true'
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: >-
            `ErrorResponse` with `error=Gone`: report already retrieved ("Report already
            retrieved. URL is no longer valid.") or no longer in the buffer ("Report is no longer
            available (expired or already delivered). URL is no longer valid.")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # -------------------------------------------------------------------------
  # M06: Knowledge Base endpoints
  # -------------------------------------------------------------------------
  /v1/kb/documents:
    post:
      tags:
        - KnowledgeBase
      summary: Upload a KB document
      description: >-
        Upload a safety document (.pdf, .md, .txt) into the project knowledge
        base. The document is chunked and embedded; the original text is stored
        Fernet-encrypted, the chunk texts and vectors in plaintext (pgvector cannot
        search ciphertext). Idempotent via SHA-256 content hash per tenant: re-uploading
        the same content (also concurrently) returns 409 Conflict. Embeddings require an Ollama-based provider
        (`ollama` / `local_mistral`); with `mistral_cloud` the upload fails.
        Requires an admin API key (`is_admin=true`), like every `/v1/kb/*` endpoint; other keys
        get 403.
      operationId: uploadKbDocument
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, Markdown, or plain text file (max 10 MB)
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                source:
                  type: string
                  enum: [UPLOAD, SHARE, URL, PLACEHOLDER]
                  default: UPLOAD
                tags:
                  type: string
                  description: Comma-separated tag list (max 16 tags)
                ttl_hours:
                  type: integer
                  minimum: 1
                  maximum: 8760
                  default: 720
      responses:
        '201':
          description: Document ingested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBDocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Duplicate content (identical SHA-256 already in the tenant's KB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    get:
      tags:
        - KnowledgeBase
      summary: List KB documents
      description: >-
        Return metadata summaries for all KB documents of the tenant. Requires an admin API key.
      operationId: listKbDocuments
      security:
        - BearerAuth: []
      parameters:
        - name: tag
          in: query
          required: false
          schema: { type: string }
          description: Filter to documents that carry the given tag
        - name: limit
          in: query
          required: false
          description: Page size
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          required: false
          description: Page offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: List of KB documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags:
        - KnowledgeBase
      summary: Bulk delete KB documents by tag
      description: >-
        Delete all KB documents tagged with the given tag (e.g. `placeholder`
        to wipe seed data once real content is loaded). Requires an admin API key.
      operationId: deleteKbDocumentsByTag
      security:
        - BearerAuth: []
      parameters:
        - name: tag
          in: query
          required: true
          description: Tag whose documents are deleted (e.g. `placeholder`)
          schema: { type: string }
      responses:
        '200':
          description: Documents deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBDeleteByTagResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/kb/documents/{doc_id}:
    get:
      tags:
        - KnowledgeBase
      summary: Get KB document metadata
      description: >-
        Return metadata for a single KB document. Original text is never returned. Requires an
        admin API key.
      operationId: getKbDocument
      security:
        - BearerAuth: []
      parameters:
        - name: doc_id
          in: path
          required: true
          description: KB document ID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: KB document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBDocumentResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

    delete:
      tags:
        - KnowledgeBase
      summary: Delete a single KB document
      description: Delete one KB document. Its embedding chunks cascade. Requires an admin API key.
      operationId: deleteKbDocument
      security:
        - BearerAuth: []
      parameters:
        - name: doc_id
          in: path
          required: true
          description: KB document ID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Document deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KBDeleteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # -------------------------------------------------------------------------
  # M10: Operations endpoints (admin API key)
  # -------------------------------------------------------------------------
  /v1/ops/summary:
    get:
      tags:
        - Operations
      summary: Operations summary
      description: Job counts by status and delivery status plus unacknowledged dead letters.
      operationId: opsSummary
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Summary counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/ops/jobs:
    get:
      tags:
        - Operations
      summary: Job overview (metadata only)
      description: >-
        Paged list of jobs across all users (Pflichtenheft §6 "Job-Übersicht ohne Inhalte").
        Filterable by job status, delivery status and project.
      operationId: opsListJobs
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: Job status filter
          schema:
            $ref: '#/components/schemas/JobStatus'
        - name: delivery_status
          in: query
          required: false
          description: Delivery status filter
          schema:
            $ref: '#/components/schemas/DeliveryStatus'
        - name: project_id
          in: query
          required: false
          description: eProjekt project ID filter
          schema: { type: string, maxLength: 255 }
        - name: limit
          in: query
          required: false
          description: Page size
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          description: Page offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsJobListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/ops/dead-letters:
    get:
      tags:
        - Operations
      summary: List delivery dead letters
      description: >-
        Definitively failed deliveries: 6h retry window exhausted, 4xx hard fail,
        pull report not retrieved within TTL, report no longer in the buffer at push time
        (`report_expired`), a project_id unusable in the push URL (`invalid_project_id`) or a
        `callback_url` rejected at delivery time (`invalid_callback_url`: host no longer on
        `CALLBACK_URL_ALLOWED_HOSTS`, or it resolves to a private/internal address).
        Processing failures (job failed before a report existed) create no dead letter.
        Content-free by design; replay is not offered because the report was deleted on
        failure (Delete-on-Delivery).
      operationId: opsListDeadLetters
      security:
        - BearerAuth: []
      parameters:
        - name: acknowledged
          in: query
          required: false
          description: "true = only acknowledged, false = only open, omit = all"
          schema: { type: boolean }
        - name: limit
          in: query
          required: false
          description: Page size
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          required: false
          description: Page offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Dead letter list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/ops/dead-letters/{dead_letter_id}:
    get:
      tags:
        - Operations
      summary: Get one dead letter
      description: Single dead-letter record (metadata only).
      operationId: opsGetDeadLetter
      security:
        - BearerAuth: []
      parameters:
        - name: dead_letter_id
          in: path
          required: true
          description: Dead letter ID
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dead letter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /v1/ops/dead-letters/{dead_letter_id}:acknowledge:
    post:
      tags:
        - Operations
      summary: Acknowledge a dead letter
      description: >-
        Marks the dead letter as investigated (records operator and optional note).
        Returns 409 if already acknowledged.
      operationId: opsAcknowledgeDeadLetter
      security:
        - BearerAuth: []
      parameters:
        - name: dead_letter_id
          in: path
          required: true
          description: Dead letter ID
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeadLetterAcknowledgeRequest'
      responses:
        '200':
          description: Acknowledged dead letter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeadLetterSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Dead letter already acknowledged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

# -----------------------------------------------------------------------------
# M08: Outgoing webhooks (eKI -> eProjekt)
#
# OpenAPI 3.1 `webhooks` block: dokumentiert Callbacks, die die eKI nach
# aussen sendet. Aktiviert wird der Webhook nur, wenn die ENV-Variable
# EPRO_WEBHOOK_URL gesetzt ist. Payload ist bewusst inhaltsarm und enthaelt
# ausschliesslich Metadaten (Pflichtenheft Anhang 1).
# -----------------------------------------------------------------------------
webhooks:
  security.delivery.failed:
    post:
      tags:
        - Security
      summary: Zustellung fehlgeschlagen (Metadaten-Webhook)
      description: >-
        Wird von der eKI an die in `EPRO_WEBHOOK_URL` konfigurierte
        Empfaenger-URL gepostet, wenn die Zustellung eines Security-Reports
        endgueltig fehlgeschlagen ist -- nach Erschoepfung des
        6-Stunden-Retry-Fensters (Push), bei einem nicht-retrybaren 4xx-Hard-Fail
        (Push), wenn ein Pull-Report nicht innerhalb der Buffer-TTL abgeholt wurde --
        oder wenn die Verarbeitung selbst gescheitert ist (Parsing, Risikoanalyse,
        Prompt-Injection-Filter), sodass nie ein Report entsteht.
        Enthaelt ausschliesslich Metadaten; KEINE Reportinhalte und KEINE
        Drehbuchtexte. Ist `EPRO_AUTH_TOKEN` gesetzt, wird er als
        `Authorization: Bearer` mitgesendet. Pflichtenheft Anhang 1 + Abnahmetest 4.
      operationId: securityDeliveryFailedWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryFailedPayload'
      responses:
        '2XX':
          description: >-
            Empfaenger hat den Webhook akzeptiert. Die eKI macht keine
            weiteren Zustellversuche fuer diesen Webhook.
        '4XX':
          description: >-
            Empfaenger lehnt Webhook ab. Die eKI behandelt jede Nicht-2xx-Antwort gleich:
            insgesamt bis zu 3 Versuche (Pause 1 s, 2 s), danach Aufgabe
            (Dead Letter mit `webhook_sent=false`).
        '5XX':
          description: >-
            Empfaenger-Fehler; wie bei 4XX insgesamt bis zu 3 Versuche, dann Aufgabe.

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIKey
      description: >-
        Opaque API key transmitted as `Authorization: Bearer eki_<token>`.
        Keys are SHA-256 hashed and stored in PostgreSQL with expiry dates.

  parameters:
    ActorUserId:
      name: X-Actor-User-Id
      in: header
      description: Optional actor user ID for audit logging (must match authenticated API-key user if provided)
      required: false
      schema:
        type: string

    ActorProjectId:
      name: X-Actor-Project-Id
      in: header
      description: Actor project ID for audit logging
      required: false
      schema:
        type: string

  schemas:

    # --- Enums ---

    ScriptFormat:
      type: string
      enum: [fdx, pdf]
      description: "Supported script formats: Final Draft XML (.fdx) or PDF (.pdf)"

    JobStatus:
      type: string
      enum: [pending, running, delivering, completed, failed, cancelled]
      description: >-
        Status of an async security check job. `delivering` (M10) = report generated,
        outbound push to ePro in progress (in pull mode only briefly, until the report is
        ready); `completed` is reached only after a 2xx from ePro (push) or when the report is
        ready for one-shot retrieval (pull). `failed` = no automated assessment available
        (processing or delivery failure, content-free `error_message`); `cancelled` = the
        workflow was cancelled by an operator.

    DeliveryStatus:
      type: string
      enum: [pending, delivering, delivered, failed, dead_lettered]
      description: >-
        Outbound delivery state, independent of the job status (M10).
        `dead_lettered` = definitively failed, content deleted, webhook sent.

    RiskLevel:
      type: string
      enum: [critical, high, medium, low, info]
      description: >-
        Risk level classification, calculated from likelihood × impact:
        critical (≥16), high (≥10), medium (≥5), low (≥2), info (<2)

    RiskCategory:
      type: string
      enum: [PHYSICAL, ENVIRONMENTAL, PSYCHOLOGICAL]
      description: Top-level risk category from the taxonomy

    # --- Request Schemas ---

    AsyncSecurityCheckRequest:
      type: object
      required:
        - script_content
        - script_format
        - project_id
      properties:
        script_content:
          type: string
          description: >-
            Base64-encoded script content (FDX as UTF-8 text, PDF as binary). The limit applies
            to the base64 string, i.e. files up to approx. 7.5 MB; larger files via multipart
            (up to `MAX_UPLOAD_SIZE_BYTES`, default 10 MB).
          minLength: 1
          maxLength: 10485760
        script_format:
          $ref: '#/components/schemas/ScriptFormat'
        project_id:
          type: string
          description: eProjekt project ID
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9_-]+$'
        script_id:
          type: [integer, 'null']
          description: >-
            eProjekt document ID of the script/treatment being analyzed.
            Passed back to ePro on push delivery so ePro can correlate the
            assessment with the correct document version. Use -1 if unknown.
            32-bit signed integer; values outside that range are rejected with 422.
        callback_url:
          type: [string, 'null']
          format: uri
          maxLength: 2083
          description: >-
            Optional HTTPS callback URL for push delivery results. If set, the result of this job
            is pushed to exactly this URL instead of
            `{EPRO_BASE_URL}/eki/scl/set-risk-assessment/{project_id}` -- same multipart payload
            (`script_id`, `status`, `assessment`, `file`), same headers (`Authorization: Bearer`
            with the ePro service token, `Idempotency-Key`, `X-Request-ID`, `X-EKI-Job-Id`,
            `X-EKI-Attempt`), same 6 h retry window and failure branch (dead letter + webhook).
            Rules (422 otherwise): HTTPS only; the host must be on the server's allow-list
            `CALLBACK_URL_ALLOWED_HOSTS` (default `epro.filmakademie.de`,
            `staging.epro.filmakademie.de`; exact host match, any port); no user/password in the
            URL; no private/internal IP literal. If `delivery` is omitted it defaults to `push`;
            `delivery=pull` together with `callback_url` is a contradiction and rejected with 422.
            Right before each push the worker checks the URL again against the then-current
            allow-list and requires every DNS answer for the host to be a public address
            (DNS-rebinding protection); a violation ends the delivery without retry (dead letter
            `invalid_callback_url`). Redirects (3xx) are not followed.
        delivery:
          type: string
          enum: [pull, push]
          description: >-
            Delivery mode: "pull" (one-shot GET via /v1/security/reports/{id}, report kept
            encrypted for at most `BUFFER_TTL_SECONDS`, default 6 h) or "push" (multipart POST
            to `callback_url` if given, otherwise to
            `{EPRO_BASE_URL}/eki/scl/set-risk-assessment/{project_id}`, with `script_id`,
            `status`, `assessment`, `file`; retried up to 6 h). Case-insensitive, surrounding
            whitespace is ignored; an empty or omitted value means "push" if `callback_url` is
            set, otherwise "pull"; any other value is rejected with 422.
        idempotency_key:
          type: [string, 'null']
          maxLength: 255
          description: >-
            Optional idempotency key to prevent duplicate jobs, scoped to the user of the API
            key. If a job with the same key already exists, the existing job is returned
            (202 with the existing `job_id`). An empty string counts as no key; control
            characters are rejected with 422.
        metadata:
          type: object
          additionalProperties: true
          description: >-
            Additional metadata (max 50 keys, values ≤1000 chars, string/number/boolean/null).
            Not persisted in PostgreSQL, but carried in the workflow input (Temporal history);
            do not put script content or personal data here.
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: >-
            Job priority, 1 = highest … 10 = lowest. Set as the Temporal task-queue priority of
            the workflow (its activities inherit it): when work is waiting in the queue, jobs
            with a higher priority are dispatched first; equal priorities keep FIFO order.
            Running jobs are not preempted. Needs the Temporal server setting
            `matching.useNewMatcher: true` (shipped in `docker/temporal/dynamicconfig/eki.yaml`);
            without it the value is stored but has no effect.

    MultipartAsyncSecurityCheckRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Script file upload (.fdx or .pdf, max 10 MB). PDF files are validated by magic bytes.
        project_id:
          type: string
          description: >-
            eProjekt project ID, validated like the JSON field (`^[a-zA-Z0-9_-]+$`, max 100
            chars). Optional for multipart (stored as `unknown` if omitted). All multipart
            fields follow the JSON rules; a text field sent as a file part is rejected with 422.
        script_format:
          $ref: '#/components/schemas/ScriptFormat'
        script_id:
          type: [integer, 'null']
          description: eProjekt document ID (32-bit signed integer)
        callback_url:
          type: string
          format: uri
          description: Optional push target, see `AsyncSecurityCheckRequest.callback_url`
        delivery:
          type: string
          enum: [pull, push]
          description: >-
            Delivery mode, see `AsyncSecurityCheckRequest.delivery` (omitted/empty: `push` with
            `callback_url`, otherwise `pull`)
        idempotency_key:
          type: [string, 'null']
          maxLength: 255
        priority:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Job priority, see `AsyncSecurityCheckRequest.priority`

    # --- Response Schemas ---

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: healthy
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: 1.0.1

    ReadinessResponse:
      type: object
      required:
        - status
        - timestamp
        - services
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: boolean
            redis:
              type: boolean
            temporal:
              type: boolean
          required: [database, redis, temporal]
          example:
            database: true
            redis: true
            temporal: true

    MeasureItem:
      type: object
      required:
        - code
        - title
      properties:
        code:
          type: string
          description: "Measure code from the catalog (e.g. RIG-SAFETY, PSY-BRIEFING, INTIMACY-COORD)"
        title:
          type: string
          description: Human-readable measure title
        responsible:
          type: string
          description: "Responsible role (e.g. Stunt Coordination, Weapons Master, Production)"
        due:
          type: string
          description: "Due date template (e.g. pre-production, shooting-3d, shooting-0d)"

    RiskFinding:
      type: object
      required:
        - id
        - risk_level
        - category
        - description
        - recommendation
        - confidence
      properties:
        id:
          type: string
          description: Unique finding ID
        scene_number:
          type: [string, 'null']
          description: Scene number where risk was found
        risk_level:
          $ref: '#/components/schemas/RiskLevel'
        category:
          $ref: '#/components/schemas/RiskCategory'
        risk_class:
          type: string
          description: >-
            Specific risk class from the taxonomy (e.g. FIRE, HEIGHT, INTIMACY,
            STUNTS, WEAPONS, WATER, VIOLENCE, TRAUMA). 23 classes across 3 categories.
        rule_id:
          type: string
          description: "Taxonomy rule ID (e.g. SEC-P-008 for FIRE, SEC-Y-003 for TRAUMA)"
        likelihood:
          type: integer
          minimum: 0
          maximum: 5
          description: "Likelihood of risk occurring (1-5, 0=unscored)"
        impact:
          type: integer
          minimum: 0
          maximum: 5
          description: "Severity of impact if risk occurs (1-5, 0=unscored)"
        description:
          type: string
          description: Human-readable description of the risk
        recommendation:
          type: string
          description: Mitigation recommendation
        measures:
          type: array
          items:
            $ref: '#/components/schemas/MeasureItem'
          description: Applicable safety measures from the codified catalog (20 measures)
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Confidence score of the finding (1.0 = FDX/certain, lower for PDF/LLM)
        line_reference:
          type: [string, 'null']
          description: Specific line or dialogue reference in the script
        evidence:
          type: string
          description: Textual evidence or rule justification supporting the risk assessment
        vulnerability:
          type: string
          description: "Vulnerability factors (e.g. children, animals, stunt doubles)"
        complexity:
          type: string
          description: "Complexity factors (e.g. extras, multi-camera, water/fire elements)"
        exposure_duration:
          type: string
          description: "Estimated risk exposure duration (e.g. kurz, mehrere Stunden, ganzer Drehtag)"

    RiskSummary:
      type: object
      description: Count of findings per risk level
      required: [critical, high, medium, low, info]
      properties:
        critical:
          type: integer
          minimum: 0
        high:
          type: integer
          minimum: 0
        medium:
          type: integer
          minimum: 0
        low:
          type: integer
          minimum: 0
        info:
          type: integer
          minimum: 0
      example:
        critical: 1
        high: 3
        medium: 5
        low: 2
        info: 1

    SecurityReport:
      type: object
      required:
        - report_id
        - project_id
        - script_format
        - created_at
        - risk_summary
        - total_findings
        - findings
        - processing_time_seconds
      properties:
        report_id:
          type: string
          format: uuid
        project_id:
          type: string
        script_format:
          $ref: '#/components/schemas/ScriptFormat'
        created_at:
          type: string
          format: date-time
        risk_summary:
          $ref: '#/components/schemas/RiskSummary'
        total_findings:
          type: integer
        findings:
          type: array
          items:
            $ref: '#/components/schemas/RiskFinding'
        processing_time_seconds:
          type: number
          format: float
          description: Seconds from job creation until the report was generated.
        metadata:
          type: object
          additionalProperties: true
          description: >-
            `engine_version` (= API version) and `taxonomy_version`. Since the
            coverage notes also `analysis_complete` (false = parts of the script
            were not risk-checked, e.g. pages beyond MAX_PDF_PAGES, pages without
            readable text, untested text before the first scene heading) and
            `coverage_notes` (German, content-free notes; also shown in the PDF
            under "Hinweise zur Vollständigkeit"). Both are absent in reports of
            older versions.

    AsyncSecurityCheckResponse:
      type: object
      required:
        - job_id
        - status
        - message
        - status_url
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        message:
          type: string
          example: "Security check job started (delivery=pull)"
        status_url:
          type: string
          description: URL to check job status (e.g. /v1/security/jobs/{job_id})
        estimated_completion_seconds:
          type: [integer, 'null']

    JobStatusResponse:
      type: object
      required:
        - job_id
        - status
        - created_at
        - updated_at
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/JobStatus'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        progress_percentage:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        report_id:
          type: [string, 'null']
          format: uuid
        error_message:
          type: [string, 'null']
        metadata:
          $ref: '#/components/schemas/JobDeliveryMetadata'

    JobDeliveryMetadata:
      type: object
      description: Delivery bookkeeping exposed with the job status (M10)
      required: [delivery_mode, delivery_status, delivery_attempts]
      properties:
        delivery_mode:
          type: string
          enum: [pull, push]
        delivery_status:
          $ref: '#/components/schemas/DeliveryStatus'
        delivery_attempts:
          type: integer
          minimum: 0
          description: >-
            Delivery attempts so far. Push: number of the last POST attempt to ePro. Pull: 0
            until the report is ready, then 1.
        delivery_last_status_code:
          type: [integer, 'null']
          description: HTTP status of the last push attempt (always null in pull mode)
        delivered_at:
          type: [string, 'null']
          format: date-time
          description: >-
            Push: timestamp of the 2xx from ePro. Pull: first set when the report is ready,
            overwritten with the one-shot retrieval time (then `delivery_status=delivered`).

    ReportResponse:
      type: object
      required:
        - report
        - message
      properties:
        report:
          $ref: '#/components/schemas/SecurityReport'
        pdf_base64:
          type: [string, 'null']
          description: >-
            Base64-encoded PDF report (human-readable) with Executive Summary,
            scene findings, and action-item checklist. Null if PDF generation failed.
        message:
          type: string
          example: Report retrieved successfully. This URL is now invalidated.

    # -----------------------------------------------------------------------
    # M10: Operations schemas (metadata only)
    # -----------------------------------------------------------------------
    OpsJobSummary:
      type: object
      required: [job_id, project_id, user_id, script_format, status, delivery_mode, delivery_status, delivery_attempts, created_at, updated_at]
      properties:
        job_id: { type: string, format: uuid }
        project_id: { type: string }
        user_id: { type: string }
        script_format:
          $ref: '#/components/schemas/ScriptFormat'
        status:
          $ref: '#/components/schemas/JobStatus'
        progress_percentage: { type: [integer, 'null'] }
        delivery_mode: { type: string, enum: [pull, push] }
        delivery_status:
          $ref: '#/components/schemas/DeliveryStatus'
        delivery_attempts: { type: integer, minimum: 0 }
        delivery_last_status_code: { type: [integer, 'null'] }
        delivery_last_attempt_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        report_id: { type: [string, 'null'], format: uuid }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OpsJobListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OpsJobSummary'
        total: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    DeadLetterSummary:
      type: object
      required: [id, job_id, project_id, user_id, delivery_mode, reason, attempts, webhook_sent, created_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        report_id: { type: [string, 'null'], format: uuid }
        project_id: { type: string }
        user_id: { type: string }
        delivery_mode: { type: string, enum: [pull, push] }
        reason:
          type: string
          enum: [retry_window_exhausted, hard_4xx, pull_ttl_expired, delivery_failed, report_expired, invalid_project_id, invalid_callback_url]
        attempts: { type: integer, minimum: 0 }
        last_status_code: { type: [integer, 'null'] }
        last_error_type: { type: [string, 'null'] }
        webhook_sent: { type: boolean }
        created_at: { type: string, format: date-time }
        acknowledged_at: { type: [string, 'null'], format: date-time }
        acknowledged_by: { type: [string, 'null'] }
        note: { type: [string, 'null'], maxLength: 1000 }

    DeadLetterListResponse:
      type: object
      required: [items, total, unacknowledged, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeadLetterSummary'
        total: { type: integer, minimum: 0 }
        unacknowledged: { type: integer, minimum: 0 }
        limit: { type: integer }
        offset: { type: integer }

    DeadLetterAcknowledgeRequest:
      type: object
      properties:
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Operator note (ticket number, action taken). No report content.

    OpsSummaryResponse:
      type: object
      required: [jobs_by_status, jobs_by_delivery_status, dead_letters_unacknowledged, generated_at]
      properties:
        jobs_by_status:
          type: object
          additionalProperties: { type: integer }
        jobs_by_delivery_status:
          type: object
          additionalProperties: { type: integer }
        dead_letters_unacknowledged: { type: integer, minimum: 0 }
        generated_at: { type: string, format: date-time }

    # --- Error Schemas ---

    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type: [string, 'null']
        message:
          type: string
        error_code:
          type: [string, 'null']

    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: [string, 'null']
          description: >-
            Correlation ID; always set by the server (taken from the request's `X-Request-ID`
            or generated) and identical to the `X-Request-ID` response header. Quote it in
            support requests.
        timestamp:
          type: string
          format: date-time

    # -----------------------------------------------------------------------
    # M06: Knowledge Base schemas
    # -----------------------------------------------------------------------
    KBDocumentResponse:
      type: object
      required: [doc_id, title, source, tags, uploaded_by, created_at, expires_at, chunk_count]
      properties:
        doc_id:
          type: string
          format: uuid
        title:
          type: string
        source:
          type: string
          enum: [UPLOAD, SHARE, URL, PLACEHOLDER]
        tags:
          type: array
          items: { type: string }
        uploaded_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        chunk_count:
          type: integer
          minimum: 0
          description: Number of embedding chunks stored for this document

    KBListResponse:
      type: object
      required: [total_returned, documents]
      properties:
        total_returned:
          type: integer
          minimum: 0
        documents:
          type: array
          items:
            $ref: '#/components/schemas/KBDocumentResponse'

    KBDeleteResponse:
      type: object
      required: [deleted, doc_id]
      properties:
        deleted:
          type: boolean
          default: true
        doc_id:
          type: string
          format: uuid

    KBDeleteByTagResponse:
      type: object
      required: [deleted, tag, count]
      properties:
        deleted:
          type: boolean
          default: true
        tag:
          type: string
        count:
          type: integer
          minimum: 0
          description: Number of documents deleted by this call

    # -----------------------------------------------------------------------
    # M08: Webhook payloads (eKI -> ePro)
    # -----------------------------------------------------------------------
    DeliveryFailedPayload:
      type: object
      required: [job_id, report_id, reason, attempts]
      description: >-
        Inhaltsarme Metadaten-Payload des security.delivery.failed Webhook.
        Enthaelt KEINE Reportinhalte und KEINE Drehbuchtexte (Pflichtenheft
        Anhang 1, Log-Hygiene Abnahmetest 7).
      properties:
        job_id:
          type: string
          description: Job-Identifikator (eKI-intern, UUID-String).
        report_id:
          type: string
          description: Report-Identifikator (eKI-intern, UUID-String).
        reason:
          type: string
          description: >-
            Maschinenlesbarer Grund. Zustellung: "retry_window_exhausted" (6h
            Push-Retry erschoepft), "hard_4xx" (nicht-retrybarer ePro-Fehler),
            "pull_ttl_expired" (Report im Pull-Modus nicht innerhalb der TTL abgeholt),
            "report_expired" (Report beim Push nicht mehr im Buffer, z. B. nach einem
            One-Shot-GET), "invalid_project_id", "invalid_callback_url" (`callback_url` bei der
            Zustellung abgelehnt), "delivery_failed". Verarbeitung (kein
            Report entstanden, `attempts`=0): "prompt_blocked", "parsing_failed",
            "processing_failed".
        attempts:
          type: integer
          minimum: 0
          description: >-
            Anzahl der Zustellungsversuche bis zum Abbruch (0 wenn nicht
            ermittelbar, z.B. Pull-TTL abgelaufen).

  headers:
    XRequestId:
      description: Correlation ID (echoed from the request or generated); appears in all logs and traces
      schema:
        type: string

  responses:
    Forbidden:
      description: >-
        Forbidden: `X-Actor-User-Id` does not match the user of the API key
        (`/v1/security/check:async`), or an admin API key is required (`/v1/ops/*`, `/v1/kb/*`:
        "Admin API key required for this endpoint")
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadRequest:
      description: >-
        Bad request: body is not valid JSON (syntax, empty, not UTF-8, form-urlencoded),
        multipart without `file`, empty file, unsupported file type, invalid PDF
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Unauthorized (missing, invalid, or expired API key)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found or access denied (ownership check failed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: >-
        Validation error (JSON body not an object, invalid base64, bad project_id format,
        invalid delivery/script_format/script_id/idempotency_key/priority, callback_url not
        allowed, `delivery=pull` together with `callback_url`, etc.)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    RateLimitExceeded:
      description: >-
        Rate limit exceeded (defaults: 60 requests/min per source IP across all endpoints,
        1000 requests/h per API key). Honour the `Retry-After` header.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error (`error=InternalServerError`, `request_id` set)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: >-
        A backend dependency (PostgreSQL, Redis or Temporal) is temporarily unavailable.
        `error` is `ServiceUnavailable` or `ServiceUnavailableException`; `request_id` is set.
        Retry with backoff. Note for submissions: if Redis (secure buffer) or Temporal was
        unreachable, the job row was already created; it is marked `failed` and its
        `idempotency_key` is released, so a retry with the same key starts a new job.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
