# OPTIONAL local Ollama for development / offline use.
#
# Inference normally runs on an EXTERNAL Ollama instance, configured in .env.local:
# LLM_PROVIDER=local_mistral uses LOCAL_MISTRAL_BASE_URL (falls back to OLLAMA_BASE_URL)
# for chat AND KB embeddings; LLM_PROVIDER=ollama uses OLLAMA_BASE_URL. The default stack (docker-compose.yml) and the production overlay
# therefore contain no Ollama service. This overlay adds one and points API and
# worker at it:
#
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull mistral-small3.2
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml exec ollama ollama pull mxbai-embed-large
#
# Image: pinned, never `latest`. ollama/ollama:0.33.3 = latest patch of the 0.33 line,
# released 2026-09-03 (image created 2026-09-03T17:04Z; multi-arch index digest
# sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2, linux/amd64 +
# linux/arm64; checked against the Docker Hub registry API on 2026-10-16). Chosen as a
# settled release (>= 4 weeks old); newer lines (0.34.x/0.35.x/0.40.x) were younger.
# eKI was not tested against a specific Ollama version: align this pin with the version
# the external production instance runs. Upgrade deliberately: bump the tag, then
# re-run the parity check (scripts/run_parity.py).
#
# GPU: the NVIDIA reservation needs nvidia-container-toolkit on the host
# (Pflichtenheft 8: >= 24 GB VRAM recommended).

services:
  ollama:
    image: ollama/ollama:0.33.3
    container_name: eki-ollama
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1
    healthcheck:
      # The image ships no curl/wget; `ollama list` queries the local server.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # CPU-only host (no NVIDIA GPU / no nvidia-container-toolkit): delete this whole
    # `deploy:` block, otherwise the container does not start. Ollama then runs on
    # the CPU -- functional, but a check takes much longer.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      # size cap only (20 MB x 5 files); Docker has no time-based rotation
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - eki-network
    restart: unless-stopped

  api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOCAL_MISTRAL_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started

  worker:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LOCAL_MISTRAL_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_data:
