# Production overlay (M11).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull api worker
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#   # optional monitoring:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.observability.yml up -d
#
# Principles (Pflichtenheft 4.1 / 5 / Security-Audit Finding 3):
# * only the API port is published; every infra service stays on the internal network
# * released images from GHCR instead of local builds; set EKI_IMAGE_TAG (default: latest)
# * no source bind mounts
# * Gunicorn supervises the Uvicorn worker (Pflichtenheft 4.1 "Uvicorn + Gunicorn")
# * local inference only: LLM_PROVIDER=local_mistral, cloud providers are rejected at startup
# * all secrets via .env.local / *_FILE (secrets/), see secrets/README.md

services:
  postgres:
    # POSTGRES_PASSWORD comes from .env.local (env_file in base compose)
    ports: []
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    ports: []
    # Persist the encrypted buffer across restarts (delivery retries up to 6h)
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    deploy:
      resources:
        limits:
          memory: 1500m

  temporal:
    ports: []

  temporal-ui:
    # Operator UI stays internal; reach it via SSH tunnel if needed.
    ports: []

  ollama:
    ports: []
    # NVIDIA GPU (Pflichtenheft 8: >= 24 GB VRAM recommended). Requires nvidia-container-toolkit.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_PARALLEL=1

  api:
    # `build:` from the base file stays declared; run `docker compose ... pull`
    # before `up -d --no-build` so the released image is used, not a local build.
    image: ghcr.io/${GHCR_OWNER:-stefanmuellerai}/eki-api:${EKI_IMAGE_TAG:-latest}
    command:
      - gunicorn
      - api.main:app
      - --worker-class
      - uvicorn.workers.UvicornWorker
      # One async worker per container; scale horizontally with `--scale api=N`
      # so every replica keeps its own consistent Prometheus registry.
      - --workers
      - "1"
      - --bind
      - 0.0.0.0:8000
      - --timeout
      - "120"
      - --graceful-timeout
      - "30"
      - --access-logfile
      - "-"
    environment:
      - ENV=production
      - DEBUG=false
      - LLM_PROVIDER=${LLM_PROVIDER:-local_mistral}
      - LOG_FORMAT=json
    volumes: []
    deploy:
      resources:
        limits:
          memory: 1500m
          cpus: "2"

  worker:
    image: ghcr.io/${GHCR_OWNER:-stefanmuellerai}/eki-worker:${EKI_IMAGE_TAG:-latest}
    environment:
      - ENV=production
      - DEBUG=false
      - LLM_PROVIDER=${LLM_PROVIDER:-local_mistral}
      - LOG_FORMAT=json
    volumes: []
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "4"
