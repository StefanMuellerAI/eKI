[project]
name = "eki-api"
dynamic = ["version"]
description = "KI-gestützte Sicherheitsprüfung für Drehbücher - Filmakademie Baden-Württemberg"
authors = [
    {name = "Filmakademie Baden-Württemberg"}
]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.2.0",
    "python-multipart>=0.0.6",

    # Validation & Settings
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    # [asyncio] pulls in greenlet, which SQLAlchemy >= 2.1 no longer installs by
    # default; without it every AsyncSession call raises ImportError.
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pgvector>=0.2.4",

    # Redis
    "redis>=5.0.1",
    "hiredis>=2.3.2",

    # Temporal Workflow Engine
    "temporalio[opentelemetry]>=1.5.0",

    # HTTP Client
    "httpx>=0.26.0",
    # Synchronous client of the operator scripts that also run inside the API
    # container (scripts/seed_kb.py) and of the host-side runners (tests/run_*.py).
    "requests>=2.31.0",

    # Observability
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    "opentelemetry-exporter-otlp-proto-http>=1.22.0",

    # Logging
    "structlog>=24.1.0",

    # XML Security
    "defusedxml>=0.7.1",

    # Encryption (Fernet for SecureBuffer)
    "cryptography>=42.0.0",

    # PDF Parsing (+ OCR fallback via tesseract binary)
    "pdfplumber>=0.10.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",

    # YAML (Prompt Management)
    "pyyaml>=6.0",

    # JSON Schema validation (M06 Mistral Cloud structured output, KB service)
    "jsonschema>=4.21",

    # PDF Report Generation
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "aiosqlite>=0.19.0",

    # Linting & Formatting
    "ruff>=0.3.0",
    "mypy>=1.8.0",

    # Type Stubs
    "types-redis>=4.6.0",

    # Security Scanning
    "bandit>=1.7.6",
    "safety>=3.0.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "services*", "workflows*", "worker*", "llm*", "db*", "parsers*", "config*"]
exclude = ["tests*", "docker*", "postman*", "secrets*", "openapi*", "scripts*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=api --cov=core --cov=services --cov=workflows --cov=parsers --cov=llm"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "temporal: needs the Temporal time-skipping test server (downloaded on first use)",
    "ocr: needs a local tesseract binary",
]

[tool.coverage.run]
source = ["api", "core", "services", "workflows", "worker", "parsers", "llm"]
omit = ["tests/*", "*/migrations/*"]
# SQLAlchemy asyncio switches greenlets inside `await session.execute(...)`;
# without greenlet support the tracer loses every handler frame after its first
# DB call and under-reports coverage by ~10 points.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "B904",  # raise from within except without from clause
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"db/migrations/versions/*.py" = ["UP007"]  # Allow Union in Alembic migrations
"scripts/*.py" = ["E402"]  # Allow imports after sys.path manipulation
"worker/main.py" = ["E402"]  # Allow imports after sys.path manipulation

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "temporalio.*",
    "prometheus_client.*",
    "pgvector.*",
]
ignore_missing_imports = true
