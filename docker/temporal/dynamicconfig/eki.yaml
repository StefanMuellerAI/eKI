# Temporal Server Dynamic Configuration
# Limits in-memory caches to prevent unbounded memory growth.
# See: https://github.com/temporalio/temporal/issues/8902

# Mutable-state cache: cap at 50 000 entries (default is unlimited per-shard)
history.hostLevelCacheMaxSize:
  - value: 50000
    constraints: {}

# Host-level events cache with 256 MB byte limit
history.enableHostLevelEventsCache:
  - value: true
    constraints: {}
history.eventsHostLevelCacheMaxSizeBytes:
  - value: 268435456  # 256 MB
    constraints: {}

# Frontend: limit concurrent gRPC connections to reduce goroutine growth
# (mitigates issue #6323 on older versions)
frontend.keepAliveMaxConnectionAge:
  - value: "5m"
    constraints: {}

# ---------------------------------------------------------------------------
# Task-queue priority (eKI 1.0.1, request field `priority`, 1 = highest)
# ---------------------------------------------------------------------------
# Temporal 1.29.x dispatches by priority only with the priority-aware matcher,
# which is OFF by default in 1.29 (`matching.useNewMatcher`, default false).
# Tasks without a priority (e.g. the maintenance schedules) get the default
# key (levels + 1) / 2. Existing backlog is kept when the matcher switches
# (the task queue is reloaded).
matching.useNewMatcher:
  - value: true
    constraints: {}

# Number of priority levels (Temporal default 5). 10 makes the API mapping of
# priority 1..10 the identity; the default key (10 + 1) / 2 = 5 equals the
# API default priority 5. Must match TEMPORAL_PRIORITY_LEVELS of the API.
matching.priorityLevels:
  - value: 10
    constraints: {}
