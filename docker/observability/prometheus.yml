global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: eki

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # FastAPI process. /metrics is API-key protected; the key is mounted as a
  # credentials file (see docker-compose.observability.yml).
  - job_name: eki-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/api_key.txt
    static_configs:
      - targets: ["api:8000"]
        labels:
          role: api

  # Temporal worker: plain exporter on the internal network only.
  - job_name: eki-worker
    static_configs:
      - targets: ["worker:9090"]
        labels:
          role: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
