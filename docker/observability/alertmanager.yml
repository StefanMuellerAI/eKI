# Alertmanager routing (M09). The default receiver is a no-op webhook so the
# stack starts without external credentials; wire e-mail/Slack/Teams here.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Replace with e.g.
    #   email_configs: [{ to: "ops@filmakademie.de", ... }]
    #   webhook_configs: [{ url: "https://hooks.example/alerts" }]
    webhook_configs:
      - url: http://127.0.0.1:9/
        send_resolved: true
