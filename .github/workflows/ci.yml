name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (pinned by requirements-dev.lock)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-dev.lock -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .

      - name: Run mypy type checker
        run: mypy api core services workflows worker
        continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (pinned by requirements-dev.lock)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-dev.lock -e ".[dev]"

      - name: Run Bandit security scan (fails on medium+ severity)
        run: |
          bandit -r api core services workflows worker llm parsers -f json -o bandit-report.json || true
          bandit -r api core services workflows worker llm parsers -ll -q

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Run Safety dependency check (advisory)
        run: safety check --json
        continue-on-error: true

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: eki_test
          POSTGRES_USER: eki_user
          POSTGRES_PASSWORD: eki_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (tesseract for OCR tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install dependencies (pinned by requirements-dev.lock)
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements-dev.lock -e ".[dev]"

      - name: Migrations (upgrade, drift check, downgrade, re-upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://eki_user:eki_password@localhost:5432/eki_test
          ENV: test
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Run tests (SQLite in-memory, fast unit mode)
        env:
          ENV: test
        run: pytest --no-cov -q

      - name: Run tests with coverage (PostgreSQL + pgvector, real Redis)
        env:
          DATABASE_URL: postgresql+asyncpg://eki_user:eki_password@localhost:5432/eki_test
          # Opt-in for tests/conftest.py: whole suite + tests/test_pg_integration.py
          # against the real dialect (the DB is wiped at session start).
          TEST_POSTGRES_URL: postgresql+asyncpg://eki_user:eki_password@localhost:5432/eki_test
          REDIS_URL: redis://localhost:6379/0
          # Real Redis for tests/test_e2e_pipeline.py (db 4 is flushed by the test).
          TEST_REDIS_URL: redis://localhost:6379/4
          ENV: test
        run: pytest --cov --cov-report=xml --cov-report=html --cov-fail-under=95

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-eki-api

  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Spectral
        run: npm install -g @stoplight/spectral-cli

      - name: Validate OpenAPI spec (0 errors required)
        run: spectral lint openapi/eki-api-v1.0.yaml --ruleset .spectral.yaml --fail-severity=error

  observability-validation:
    name: Observability Rules (M09)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: promtool check alert rules
        run: |
          docker run --rm -v "${{ github.workspace }}/docker/observability:/obs:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 check rules /obs/alerts.yml

      - name: amtool check Alertmanager config
        run: |
          docker run --rm -v "${{ github.workspace }}/docker/observability:/obs:ro" \
            --entrypoint amtool prom/alertmanager:v0.27.0 check-config /obs/alertmanager.yml

      - name: docker compose config (base + observability overlay)
        run: |
          cp .env.example .env.local
          mkdir -p secrets && touch secrets/prometheus_api_key.txt
          docker compose -f docker-compose.yml -f docker-compose.observability.yml config -q

      - name: Prod overlay publishes only the API and bind-mounts no source code
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --format json > /tmp/prod.json
          python3 - <<'EOF'
          import json
          services = json.load(open("/tmp/prod.json"))["services"]
          published = {n: [p.get("published") for p in s.get("ports", [])] for n, s in services.items()}
          extra = {n: p for n, p in published.items() if p and n != "api"}
          assert not extra, f"infra ports published in prod: {extra}"
          assert published["api"] == ["8000"], published["api"]
          code_dirs = {"api", "core", "services", "workflows", "db", "llm", "parsers", "config", "scripts"}
          mounts = {
              n: [v["source"] for v in s.get("volumes", []) if v.get("type") == "bind"
                  and v["source"].rstrip("/").rsplit("/", 1)[-1] in code_dirs]
              for n, s in services.items()
          }
          leaked = {n: m for n, m in mounts.items() if m}
          assert not leaked, f"source bind mounts in prod: {leaked}"
          print("prod overlay OK:", published)
          EOF

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: eki-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: eki-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment file
        run: cp .env.example .env.local

      - name: Start services with Docker Compose
        run: docker compose up -d --build

      - name: Wait for services to be ready
        run: |
          timeout 120 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      - name: Check API health
        run: curl -f http://localhost:8000/health

      - name: Apply DB migrations inside the API image (as in production)
        run: |
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api alembic check

      - name: Check API readiness
        run: curl -f http://localhost:8000/ready || true

      - name: Check Swagger UI
        run: curl -f http://localhost:8000/docs

      - name: Check Temporal UI
        run: curl -f http://localhost:8080 || true

      - name: View logs
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down -v

  release-images:
    name: Publish images (GHCR)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, security-scan, openapi-validation]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify tag matches core/version.py
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('core/version.py').read_text()).group(1))")
          test "$TAG" = "$CODE" || { echo "tag v$TAG != core/version.py $CODE"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/eki-api:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/eki-api:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/eki-worker:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/eki-worker:latest
          labels: |
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
